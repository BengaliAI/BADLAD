[project]
name = "badlad-leaderboard"
version = "0.1.0"
description = "Maintainer-run BaDLAD DLA leaderboard decode + score tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "pycocotools==2.0.11",
  "opencv-python-headless>=4.10.0",
  "numpy==2.0.1",
  "pandas==2.3.2",
  "tqdm==4.67.1",
  "fvcore==0.1.5.post20221221",
  "iopath==0.1.9",
  "omegaconf==2.3.1",
  "Pillow==11.3.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
